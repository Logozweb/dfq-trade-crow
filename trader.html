<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trader Storefront | DFQ Trade Crow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <script>
    (function () {
      const saved = localStorage.getItem("dfq_theme_mode");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <nav class="navbar bg-white border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold" href="index.html">DFQ <span class="text-sky">Trade Crow</span></a>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-sky btn-sm">Back to Marketplace</a>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-inline-flex align-items-center gap-1" data-theme-toggle title="Toggle Dark/Light Theme">
          <i class="bi bi-moon-stars-fill"></i><span class="theme-label d-none d-sm-inline">Dark</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-5" id="traderContent">
    <div class="text-center py-5">
      <div class="spinner-border text-sky" role="status"></div>
      <p class="text-muted mt-2">Loading trader profile...</p>
    </div>
  </div>

  <script>
    async function loadTraderProfile() {
      const container = document.getElementById('traderContent');
      const params = new URLSearchParams(window.location.search);
      const traderId = params.get('id') || '1';

      try {
        const res = await fetch(`/api/traders/${traderId}`);
        const data = await res.json();

        if (!data.success || !data.trader) {
          container.innerHTML = `
            <div class="alert alert-warning rounded-4 shadow-sm p-4">
              <h5 class="fw-bold">Trader profile not found</h5>
              <p class="mb-0">The requested trader storefront could not be located or has been deactivated.</p>
              <a href="index.html" class="btn btn-sky btn-sm mt-3">Return to Marketplace</a>
            </div>
          `;
          return;
        }

        const t = data.trader;
        const items = data.items || [];
        const reviews = data.reviews || [];
        const avgRating = data.avgRating || '5.0';
        const swappedCount = data.swappedCount || 0;

        document.title = `${t.full_name} — Trader Storefront | DFQ Trade Crow`;

        const memberDate = t.created_at ? new Date(t.created_at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : 'Recently';

        let itemsHtml = '';
        if (items.length === 0) {
          itemsHtml = `<div class="col-12"><div class="bg-white border rounded-4 p-4 text-muted">No active listings available right now.</div></div>`;
        } else {
          itemsHtml = items.map(it => `
            <div class="col-md-4">
              <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
                <img src="${it.image_path}" style="height:190px;object-fit:cover;" alt="${it.title}" onerror="this.src='assets/img/phone.svg'" />
                <div class="card-body d-flex flex-column">
                  <span class="badge bg-info-subtle text-dark align-self-start mb-2">${it.mode}</span>
                  <h6 class="fw-bold text-dark">${it.title}</h6>
                  <p class="small text-muted flex-grow-1">Wants: <strong>${it.wanted}</strong></p>
                  <a href="index.html#marketplace" class="btn btn-sky btn-sm mt-2">View on Marketplace</a>
                </div>
              </div>
            </div>
          `).join('');
        }

        let reviewsHtml = '';
        if (reviews.length === 0) {
          reviewsHtml = `<div class="bg-white border rounded-4 p-4 text-muted small">No customer reviews yet.</div>`;
        } else {
          reviewsHtml = reviews.map(r => `
            <div class="bg-white border rounded-4 p-3 shadow-sm">
              <div class="d-flex justify-content-between">
                <strong class="text-dark small">${r.reviewer_name}</strong>
                <span class="text-warning small fw-bold">${'★'.repeat(Math.max(1, Math.min(5, r.rating)))}</span>
              </div>
              <p class="small text-secondary mb-0 mt-1">${r.comment || 'Verified Trade Transaction'}</p>
            </div>
          `).join('');
        }

        container.innerHTML = `
          <div class="bg-white border rounded-4 p-4 mb-4 shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
              <span class="badge bg-sky-tint text-sky border border-info mb-2">Verified DFQ Trader</span>
              <h2 class="fw-bold text-dark mb-1">${t.full_name}</h2>
              <p class="text-muted small mb-0">
                <i class="bi bi-geo-alt-fill text-sky"></i> ${t.location || 'Nigeria'} &bull;
                Member since ${memberDate}
              </p>
            </div>
            <div class="d-flex gap-3 text-center">
              <div class="px-3 py-2 rounded-3 bg-light border">
                <div class="fw-bold fs-4 text-warning-emphasis"><i class="bi bi-star-fill text-warning"></i> ${avgRating}</div>
                <small class="text-muted">${reviews.length} Reviews</small>
              </div>
              <div class="px-3 py-2 rounded-3 bg-light border">
                <div class="fw-bold fs-4 text-sky">${swappedCount}</div>
                <small class="text-muted">Completed Swaps</small>
              </div>
            </div>
          </div>

          <h5 class="fw-bold text-dark mb-3">Active Listings by ${t.full_name} (${items.length})</h5>
          <div class="row g-4 mb-5">
            ${itemsHtml}
          </div>

          <h5 class="fw-bold text-dark mb-3">Trader Reviews (${reviews.length})</h5>
          <div class="d-grid gap-3">
            ${reviewsHtml}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-danger rounded-4 p-4">
            <h5>Failed to load trader storefront</h5>
            <p class="mb-0">${err.message}</p>
          </div>
        `;
      }
    }

    // Theme toggling support
    (function () {
      function syncThemeButtons(theme) {
        document.querySelectorAll("[data-theme-toggle]").forEach((btn) => {
          const icon = btn.querySelector("i");
          const label = btn.querySelector(".theme-label");
          if (theme === "dark") {
            if (icon) icon.className = "bi bi-sun-fill text-warning";
            if (label) label.textContent = "Light";
            btn.setAttribute("title", "Switch to Light Theme");
          } else {
            if (icon) icon.className = "bi bi-moon-stars-fill";
            if (label) label.textContent = "Dark";
            btn.setAttribute("title", "Switch to Dark Theme");
          }
        });
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("dfq_theme_mode", theme);
        syncThemeButtons(theme);
      }

      window.toggleDfqTheme = function () {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        applyTheme(current === "dark" ? "light" : "dark");
      };

      document.addEventListener("DOMContentLoaded", () => {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        syncThemeButtons(current);
        document.querySelectorAll("[data-theme-toggle]").forEach((btn) => {
          btn.addEventListener("click", window.toggleDfqTheme);
        });
        loadTraderProfile();
      });
    })();
  </script>
</body>
</html>
